name: Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 写入版本号
        run: |
          $version = "1.0.${{ github.run_number }}"
          $json = @{ version = $version } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$PWD/version.json", $json, (New-Object System.Text.UTF8Encoding($false)))
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      - name: 完整自包含构建（用于 zip）
        run: >
          dotnet publish SETBoard.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=none
          -o publish-full

      - name: 单文件构建（用于直接下载 exe）
        run: >
          dotnet publish SETBoard.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish-single

      - name: 打包 zip（完整构建）
        run: Compress-Archive -Path publish-full/* -DestinationPath "SETBoard-v$env:VERSION-win-x64.zip"
        shell: pwsh

      - name: 准备 Release 说明
        run: |
          $body = @"
          ${{ github.event.head_commit.message }}

          [View Changes](${{ github.event.compare.url }})
          "@
          $body | Out-File -FilePath "$PWD/release-body.txt" -Encoding utf8
          "RELEASE_BODY_PATH=$PWD/release-body.txt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SETBoard v${{ env.VERSION }}
          files: |
            SETBoard-v${{ env.VERSION }}-win-x64.zip
            publish-single/SETBoard.exe
          body_path: ${{ env.RELEASE_BODY_PATH }}
          draft: false
          prerelease: false
