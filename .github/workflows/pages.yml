name: Deploy Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Page/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次发布，新提交排队而不是中断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Page 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: Page

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
